services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - BACKEND_CORS_ORIGINS=http://localhost:5173,http://frontend:80
    volumes:
      - /tmp/ai-analyst-sessions:/tmp/ai-analyst-sessions
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    restart: unless-stopped

networks:
  default:
    name: ai-analyst-network

volumes:
  sessions-data:
    driver: local
